[project]
name = "svccat-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Lam", email = "72969119+alex-tw-lam@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "django>=6.1.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "requests>=2.34.2",
]

[project.scripts]
svccat-platform = "svccat_platform:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
